version: 2
updates:
  # SHA-pinned actions in .github/workflows; updates bump the pin and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  # Python dependencies from pyproject.toml (runtime + dev extras).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-dependencies:
        patterns: ["*"]

  # Digest-pinned python base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # CI tests the application on Python 3.12; moving the container runtime
      # to a new major/minor Python is a deliberate change, not an automated
      # one. Patch releases and digest refreshes still flow through.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
