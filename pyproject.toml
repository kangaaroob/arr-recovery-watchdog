[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "arr-recovery-watchdog"
version = "1.0.0"
description = "Watchdog that clears Prowlarr/Sonarr/Radarr indexer circuit-breaker cooldowns after a Gluetun VPN outage recovers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.scripts]
arr-recovery-watchdog = "arr_recovery_watchdog.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arr_recovery_watchdog"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["arr_recovery_watchdog"]
